# Configuración de Servidor Netlify: Ahorro de Ancho de Banda + Invalidación Inteligente de Caché

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Recursos Multimedia de Alto Ancho de Banda (Videos, Imágenes, Audios)
# Se almacenan en caché del navegador (1 año) ahorrando datos y ancho de banda gratuito en Netlify.
# Al cambiar un archivo, la versión ?v=20260816_v3 en index.html fuerza la descarga inmediata.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
